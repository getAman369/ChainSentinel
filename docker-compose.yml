version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chainsentinel-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./ml:/app/ml
      - ./public:/app/public
      - ./docs:/app/docs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_interval: 10s

  redis:
    image: redis:7-alpine
    container_name: chainsentinel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: chainsentinel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: chainsentinel
