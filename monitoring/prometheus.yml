global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "chainsentinel-api"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: "/metrics"

  - job_name: "chainsentinel-contracts"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: "/metrics/blockchain"

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
